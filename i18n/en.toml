# Chrome-level separator dash for joining two short facts (e.g. a
# date range and a location) -- de-CH uses en dash, English em dash,
# both spaced; not the "no surrounding spaces" em-dash rule from
# CLAUDE.md's Typography section, since that's specifically about
# prose asides, not this compact listing style. Must not be hardcoded
# into any template -- see CLAUDE.md's Typography section for why
# (found a real instance where it was, on the resume page).
[dash_separator]
other = "—"

# kind_<kind> for the byline badge / grid tile. NOTE: kind "patent"
# and kind "patent_application" have NO key here — their badge is the
# per-file `kind_label` instead ("Patent" for a single-member family,
# "Patent Family" for multiple, "Patent Application" for an unpursued
# one). See CLAUDE.md's Publications section.
[kind_talk]
other = "Talk"
[kind_paper]
other = "Paper"
[kind_book]
other = "Book"
[kind_lecture]
other = "Lecture Series"
# A defensive disclosure / prior-art publication (e.g. on Technical
# Disclosure Commons) — a written technical document, but not a
# peer-reviewed paper and not a patent, so it gets its own kind.
# kind_label usually mirrors this; JP-style overrides are still possible.
[kind_disclosure]
other = "Defensive Disclosure"

[download_pdf]
other = "Download PDF"

[original_title_label]
other = "Original title ({{.Language}}):"

# language_name_<BCP-47 code>: add a pair here and in i18n/de.toml
# whenever a new original_language value appears in content. Used to
# localize the language name shown in original_title_label, per the
# SITE's current language -- not the code itself, and not the named
# language's own name for itself.
[language_name_de]
other = "German"
[language_name_en]
other = "English"
[language_name_ja]
other = "Japanese"

[tags_label]
other = "Tags:"

[assignee_label]
other = "Assigned to:"

# Patent pages list one invention with its whole family (one grant per
# jurisdiction), each with its own status — see CLAUDE.md's Publications
# section. Superseded the old singular patent_number/patent_status keys.
[patent_family_label]
other = "Patent family:"
[patent_one_label]
other = "Patent:"
[patent_application_label]
other = "Application:"
# patent_family entries store a WIPO ST.3 office code (mostly ISO 3166
# alpha-2: US, JP, KR, CN, DE, CA, BR; plus EP, WO). Add a
# patent_office_<CODE> pair to BOTH i18n files whenever a new code
# appears in content — same rule as language_name_<code>.
[patent_office_US]
other = "United States"
[patent_office_JP]
other = "Japan"
[patent_office_KR]
other = "South Korea"
[patent_office_CN]
other = "China"
[patent_office_CA]
other = "Canada"
[patent_office_BR]
other = "Brazil"
[patent_office_DE]
other = "Germany"
[patent_office_EP]
other = "Europe"
[patent_member_active]
other = "in force until {{ .Year }}"
[patent_member_expired]
other = "expired {{ .Year }}"
[patent_member_lapsed]
other = "lapsed {{ .Year }}"
[patent_member_abandoned]
other = "application abandoned"
# Headline: "since" when every family member is dead, "from" when at
# least one is still in force (using the latest expiry among those).
[patent_pd_since]
other = "Free for public use since {{ .Year }}."
[patent_pd_from]
other = "Free for public use from {{ .Year }} onward."

[open_source_label]
other = "Open Source"

# role_<value>: badge shown on project cards/detail pages, same pattern
# as kind_<value> for publications -- see CLAUDE.md's Projects bundle
# front matter section. Describes Sascha's own involvement in the
# project (did he create it, maintain it, or contribute a few things),
# not a property of the project's repo.
[role_creator]
other = "Creator"
[role_maintainer]
other = "Maintainer"
[role_contributor]
other = "Contributor"

# project_status_<value>: whether SASCHA is still actively involved in
# the project right now -- independent of role, and independent of
# whether the project/repo itself is still alive or maintained by
# anyone else. See CLAUDE.md. Kept as its own separate byline segment,
# deliberately NOT fused into the date phrase (e.g. not "Active since
# 2016") -- an initial fused version overstated current engagement on
# projects Sascha is still nominally involved in but not "super-active"
# on, per his own correction.
[project_status_active]
other = "Actively involved"
[project_status_inactive]
other = "No longer involved"

# Leading word of the computed date phrase for an open-ended project
# (no end_date), e.g. "Since 2016" -- see CLAUDE.md's Projects bundle
# front matter section.
[project_since_label]
other = "Since"

[view_on_github]
other = "View on GitHub"

[related_label]
other = "See also:"

[resume_experience]
other = "Experience"
[resume_education]
other = "Education"
[resume_skills]
other = "Skills"
[resume_programming_languages]
other = "Programming Languages"
[resume_operating_systems]
other = "Operating Systems"
[resume_spoken_languages]
other = "Languages"

# Label for the mailto: link in the résumé's identity line — the raw
# address is deliberately not shown there (keeps the row even).
[contact_email]
other = "Email"

[gallery_empty]
other = "Nothing here yet — check back soon."

[footer_copyright]
other = "© {{.Year}} Sascha Brawer"

