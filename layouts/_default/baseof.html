<!doctype html>
<html lang="{{ .Site.Language.Lang }}">
<head>
{{ partial "head.html" . }}
</head>
<body{{ if and .File (eq .File.ContentBaseName "resume") }} class="resume-page"{{ end }}>
<a class="skip-link" href="#main">{{ i18n "skip_to_content" }}</a>
<header>
  {{ partial "header.html" . }}
</header>
{{ partial "drawer.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
<script src="/js/nav.js" defer></script>
</body>
</html>
