baseURL = "https://brawer.ch/"
title = "Sascha Brawer"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false   # English at /, German at /de/

# Menu entries below use `pageRef` (a content path Hugo resolves to the
# actual per-language page), not a literal `url` string. Found and fixed
# 2026-08-25: with `url`, the exact same literal string ("/art/" etc.)
# was set in both the English and German menu blocks, so every German
# menu link pointed at the un-prefixed English URL ("/art/" instead of
# "/de/art/") -- Hugo does NOT localize a literal `url` for you. `pageRef`
# resolves within the current language's page tree, per language.
#
# Each entry also carries an explicit `identifier` (same value in both
# languages: "resume"/"projects"/"publications"/"art") -- templates that
# need to know WHICH section a menu entry is (index.html's tile icons,
# grid-header.html's translated heading) match on this, not on
# `.Page.Section`. Found 2026-08-25: `.Page.Section` is empty for
# `content/resume/` (and `content/imprint/`) specifically, because
# Hugo only auto-vivifies a real "section" for a top-level content
# directory that holds more than one page -- a lone single-page bundle
# like resume's does NOT get one, unlike art/projects/publications
# (each has multiple pages). That silently broke the entry page's
# Résumé tile icon (the slug-match against "resume" never fired) even
# though the exact same pattern worked fine for the other three
# sections. `identifier` sidesteps this entirely, since it doesn't
# depend on Hugo's section auto-vivification at all.

# Pretty URLs like /art/golden-retriever/ instead of /art/golden-retriever.html
uglyURLs = false

# Generate /tags/<tag>/ pages automatically from the `tags` front matter field.
[taxonomies]
  tag = "tags"

[languages]
  [languages.en]
    # Short form ("EN"/"DE"), not "English"/"Deutsch" -- data-to-ink
    # ratio call, 2026-08-25 (Sascha). Only consumed by the language
    # switcher (layouts/partials/utility-nav.html, the one shared
    # partial for the header/footer/drawer instances) -- NOT the same
    # thing as the i18n language_name_<code> keys used for "Original
    # title (Japanese):" on publications like jp6511221b2, which stay
    # full words on purpose; don't conflate the two mechanisms.
    label = "EN"
    weight = 1

    [languages.en.params]
      location = "Bern, Switzerland"
      intro = """\
        I’ve been curious about how things work for as long as I can remember, \
	and that curiosity shows up everywhere — in the open-source code I write, \
	the books I read, and the paintings I make. I especially like taking \
	something complicated and making it simple — simple enough that \
	it’s actually useful to real people.\
	"""

    [[languages.en.menu.main]]
      name = "Résumé"
      identifier = "resume"
      pageRef = "/resume"
      weight = 10
    [[languages.en.menu.main]]
      name = "Projects"
      identifier = "projects"
      pageRef = "/projects"
      weight = 20
    [[languages.en.menu.main]]
      name = "Publications"
      identifier = "publications"
      pageRef = "/publications"
      weight = 30
    [[languages.en.menu.main]]
      name = "Art"
      identifier = "art"
      pageRef = "/art"
      weight = 40

  [languages.de]
    locale = "de-CH"
    label = "DE"
    weight = 2

    [languages.de.params]
      location = "Bern, Schweiz"
      intro = """\
        Solange ich zurückdenken kann, bin ich neugierig darauf, wie \
        Dinge funktionieren – und diese Neugier zeigt sich überall: im \
        Open-Source-Code, den ich schreibe, in den Büchern, die ich \
        lese, und in den Bildern, die ich male. Am liebsten nehme ich \
        etwas Kompliziertes und mache es einfach – so einfach, dass \
        es für Menschen nützlich ist.\
        """

    [[languages.de.menu.main]]
      name = "Lebenslauf"
      identifier = "resume"
      pageRef = "/resume"
      weight = 10
    [[languages.de.menu.main]]
      name = "Projekte"
      identifier = "projects"
      pageRef = "/projects"
      weight = 20
    [[languages.de.menu.main]]
      name = "Publikationen"
      identifier = "publications"
      pageRef = "/publications"
      weight = 30
    [[languages.de.menu.main]]
      name = "Kunst"
      identifier = "art"
      pageRef = "/art"
      weight = 40

# Language-independent params, inherited by both languages above
# (each language’s own [params] block can still override individual keys).
[params]
  fullName = "Sascha Brawer"

  [params.social]
    github = "https://github.com/brawer/"
    linkedin = "https://www.linkedin.com/in/sascha-brawer/"
    email = "sascha@brawer.ch"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# Image processing defaults used when rendering responsive art thumbnails.
[imaging]
  resampleFilter = "Lanczos"
  quality = 85
  anchor = "smart"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
    # Disabled deliberately (2026-08-24): this extension auto-converts
    # straight quotes/apostrophes to curly ones, which silently masked
    # three straight apostrophes in English content that had skipped
    # review (CLAUDE.md's typography policy already said not to rely
    # on this, for a different reason -- it can't produce guillemets --
    # but discovered this session it was also hiding real violations
    # rather than catching them). With it off, a missed straight quote
    # now renders visibly wrong instead of silently looking fine.
    [markup.goldmark.extensions.typographer]
      disable = true

[minify]
  disableXML = true

[privacy]
  [privacy.vimeo]
    disabled = true
  [privacy.twitter]
    disabled = true
  [privacy.youtube]
    disabled = true
