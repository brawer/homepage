name: Check content

# Content-structure checks that don't need real templates to run —
# Hugo parses front matter and wires up bundles/taxonomies regardless
# of whether there's a layout to render them with, so this catches
# real content bugs long before any /design work exists. Renamed from
# check-bilingual-content.yml since it now covers more than bilingual
# coverage. Checks:
#   1. No file under content/ is a symlink, ever. On 2026-08-24 we
#      found that a symlinked content/.../index.de.md is silently
#      invisible to Hugo (never becomes a page at all, no warning, no
#      error) even though `git ls-files -s` happily reports it as a
#      correct symlink. See CLAUDE.md's Bilingual section.
#   2. Every page Hugo actually builds has at least one translation,
#      using Hugo's own page-translation linking (hugo.Sites / .Pages
#      / .Translations) as the source of truth — not a hand-rolled
#      reimplementation of Hugo's pairing rules (which include some
#      non-obvious behavior, like auto-pairing same-string taxonomy
#      terms with no backing content file at all).
#   3. Every `image`/`pdf` front-matter field on a page resolves to an
#      actual bundle resource — catches typos/renamed files that
#      would otherwise only surface once templates exist and try to
#      render a broken link.
#   4. Typography policy in both languages, via scripts/check_typography.py
#      — EN: no straight quotes/apostrophes anywhere (front matter
#      prose fields included, via real YAML parsing, not just the
#      Markdown body); DE: no em dash (—), no German-German low-high
#      quotes („/‚), no straight quotes, same front-matter coverage.
#      This bug class recurred repeatedly before being retrofitted —
#      including straight apostrophes/quotes that Goldmark's
#      typographer extension was silently auto-correcting at render
#      time (now disabled in hugo.toml specifically so this can't
#      happen unnoticed again) and a front-matter-only violation a
#      Markdown-body-only grep check couldn't have caught. See
#      CLAUDE.md's Typography section.
#   5. Every LFS-tracked *.webp/*.pdf is real content, not an
#      unresolved pointer file — CLAUDE.md's Git LFS section warns
#      this fails silently otherwise ("the build won't error, it'll
#      just produce a broken site").

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.165.0"
          extended: true

      - name: Reject symlinked content files
        run: |
          symlinks="$(find content -type l)"
          if [ -n "$symlinks" ]; then
            echo "::error::Symlinked file(s) found under content/ — Hugo silently ignores these, they never become pages. Write a real file instead (see CLAUDE.md's Bilingual section):"
            echo "$symlinks"
            exit 1
          fi

      - name: Verify every page has a translation
        run: |
          set -e
          mkdir -p layouts
          # Throwaway layouts/index.html, deleted at the end of this
          # step — real templates (layouts/partials/*.html) must
          # survive for later steps, so only that one file is removed,
          # never the whole layouts/ dir. Ranges
          # over every page on every language site and fails the build
          # via errorf if any page has zero translations. Runs once per
          # configured language (each is a "home" kind render), so a
          # violation may be logged more than once — harmless, still a
          # single overall failure either way.
          cat > layouts/index.html <<'TMPL'
          {{ range hugo.Sites }}
          {{ range .Pages }}
          {{ if eq (len .Translations) 0 }}
          {{ $path := .Kind }}
          {{ with .File }}{{ $path = .Path }}{{ end }}
          {{ errorf "%s (lang=%s, kind=%s) has no translation in another language — every content item must be fully bilingual, see CLAUDE.md" $path .Lang .Kind }}
          {{ end }}
          {{ end }}
          {{ end }}
          <html></html>
          TMPL
          hugo build --gc --cleanDestinationDir
          rm -f layouts/index.html
          rm -rf public resources .hugo_build.lock

      - name: Check typography (both languages, front matter + body)
        run: |
          pip install --quiet pyyaml
          python3 scripts/check_typography.py

      - name: Check LFS files resolved to real content
        run: |
          fail=0
          for f in $(git ls-files '*.webp' '*.pdf'); do
            if head -c 60 "$f" | grep -q '^version https://git-lfs.github.com/spec/v1'; then
              echo "::error file=$f::This LFS-tracked file is still an unresolved pointer file, not real content — check that Git LFS is installed and the checkout step used lfs: true (see CLAUDE.md's Git LFS section)."
              fail=1
            fi
          done
          exit $fail

      - name: Verify image/pdf front-matter references resolve
        run: |
          set -e
          mkdir -p layouts
          # Same throwaway-template approach as the previous step, for
          # the same reason: Hugo's own Resources.GetMatch is the
          # ground truth for "does this bundle actually contain that
          # file", not a hand-rolled filesystem check.
          cat > layouts/index.html <<'TMPL'
          {{ range hugo.Sites }}
          {{ range .Pages }}
          {{ if eq .Kind "page" }}
          {{ $path := .Kind }}
          {{ with .File }}{{ $path = .Path }}{{ end }}
          {{ if .Params.image }}
          {{ if not (.Resources.GetMatch .Params.image) }}
          {{ errorf "%s: image %q not found among bundle resources" $path .Params.image }}
          {{ end }}
          {{ end }}
          {{ if .Params.pdf }}
          {{ if not (.Resources.GetMatch .Params.pdf) }}
          {{ errorf "%s: pdf %q not found among bundle resources" $path .Params.pdf }}
          {{ end }}
          {{ end }}
          {{ end }}
          {{ end }}
          {{ end }}
          <html></html>
          TMPL
          hugo build --gc --cleanDestinationDir
          rm -f layouts/index.html
          rm -rf public resources .hugo_build.lock
